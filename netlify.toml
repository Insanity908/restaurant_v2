[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router usa rotas client-side (/pos, /kitchen, /admin, etc.) — sem isto,
# recarregar a página numa rota que não seja "/" dá 404 no Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# O service worker e o manifest da PWA não podem ficar em cache longa duração:
# se ficarem, uma atualização da app pode nunca chegar aos utilizadores.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
