project_id = "bbpfoygfxqwjqsolisqw"

# archive-old-years é chamada pelo pg_cron sem sessão de utilizador (só um
# cabeçalho x-cron-secret) — sem isto, a plataforma rejeitava o pedido com
# 401 antes de o código da função sequer correr. A função continua a
# autenticar-se sozinha: modo cron por x-cron-secret == CRON_SECRET, modo
# manual por sessão real de super-admin (ver index.ts).
[functions.archive-old-years]
verify_jwt = false

# send-push também aceita um caminho de confiança sem JWT: gatilhos
# Postgres (pg_net, ver supabase/migrations/*_push_event_triggers.sql)
# autenticam-se só por x-push-trigger-secret == PUSH_TRIGGER_SECRET, sem
# sessão de utilizador — mesmo motivo que archive-old-years acima. O
# caminho normal (JWT de utilizador, ou Bearer com a service_role key)
# continua a funcionar exactamente na mesma com verify_jwt = false — a
# verificação é só feita dentro do próprio index.ts.
[functions.send-push]
verify_jwt = false

# auto-activate-payment é chamada pela app de reencaminhamento de SMS no
# telemóvel do superadmin (D2, docs/spec-automacao-confirmacao-
# pagamentos.md) — nunca tem uma sessão Supabase, só o cabeçalho
# x-payment-webhook-secret == PAYMENT_WEBHOOK_SECRET, verificado dentro do
# próprio index.ts (mesmo padrão de archive-old-years/send-push acima).
[functions.auto-activate-payment]
verify_jwt = false